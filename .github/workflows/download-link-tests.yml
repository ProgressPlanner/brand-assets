name: Download link tests

on:
  push:
    paths:
      - 'assets/download-links-editor.js'
      - 'tests/**'
      - '.github/workflows/download-link-tests.yml'
  pull_request:
    paths:
      - 'assets/download-links-editor.js'
      - 'tests/**'
      - '.github/workflows/download-link-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Test download link controls
        run: node --test tests/*.test.cjs
